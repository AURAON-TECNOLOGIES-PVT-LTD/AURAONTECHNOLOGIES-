
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Essential -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>
      Auraon Technologies | Technology Ventures & Digital Innovation
    </title>

    <meta
      name="description"
      content="Auraon Technologies & Software Solutions Pvt. Ltd. is a Hyderabad, India-based technology company focused on creating technology ventures, digital innovation and meaningful solutions for the future."
    />

    <meta
      name="keywords"
      content="Auraon Technologies, Auraon Technologies Hyderabad, Auraon Technologies Private Limited, Technology Company India, Technology Ventures, Digital Innovation, Technology Entrepreneurship"
    />

    <meta
      name="author"
      content="Auraon Technologies & Software Solutions Pvt. Ltd."
    />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.auraontechnologies.com/"
    />

    <!-- Website Identity -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Brand Logo -->
    <link
      rel="preload"
      as="image"
      href="/logo.jpg"
    />

    <!-- Open Graph: Facebook, LinkedIn and WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />

    <meta
      property="og:site_name"
      content="Auraon Technologies"
    />

    <meta
      property="og:title"
      content="Auraon Technologies | Technology Ventures & Digital Innovation"
    />

    <meta
      property="og:description"
      content="Creating technology ventures through bold thinking, strategic direction and digital innovation. Discover Auraon Technologies, Hyderabad, India."
    />

    <meta
      property="og:url"
      content="https://www.auraontechnologies.com/"
    />

    <meta
      property="og:image"
      content="https://www.auraontechnologies.com/logo.jpg"
    />

    <meta
      property="og:image:alt"
      content="Auraon Technologies company logo"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="Auraon Technologies | Technology Ventures"
    />

    <meta
      name="twitter:description"
      content="A technology company focused on innovation, technology ventures and creating meaningful solutions for the future."
    />

    <meta
      name="twitter:image"
      content="https://www.auraontechnologies.com/logo.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Auraon Technologies company logo"
    />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Auraon Technologies & Software Solutions Pvt. Ltd.",
        "alternateName": "Auraon Technologies",
        "url": "https://www.auraontechnologies.com/",
        "logo": "https://www.auraontechnologies.com/logo.jpg",
        "image": "https://www.auraontechnologies.com/logo.jpg",
        "description": "A Hyderabad-based technology company focused on technology ventures, digital innovation and creating meaningful solutions for the future.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hyderabad",
          "addressRegion": "Telangana",
          "addressCountry": "IN"
        },
        "founder": {
          "@type": "Person",
          "name": "CH Sai Balaji Singh Rajput",
          "jobTitle": "Founder & CEO",
          "image": "https://www.auraontechnologies.com/images/FOUNDER/CEO.png"
        }
      }
    </script>

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
